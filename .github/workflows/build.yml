name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Generate Wrapper
        run: gradle wrapper --gradle-version 8.5 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        id: build
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build_log.txt 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # 输出错误关键行到annotations
          grep -i -E "error:|FAILURE:|What went wrong:|Caused by:|e: " build_log.txt | head -30 | while read line; do
            echo "::error::$line"
          done
          echo "=== LAST 50 LINES ==="
          tail -50 build_log.txt
          exit $EXIT_CODE

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

      - name: List output files
        run: ls -la app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quizmaster-apk
          path: app/build/outputs/apk/debug/*.apk
